<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search for Developers on GitHub" />
    <meta name="color-scheme" content="light dark" />

    <!-- Favicons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicons/favicon-16x16.png"
    />
    <link rel="manifest" href="/assets/favicons/site.webmanifest" />

    <!-- Font Imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graphs  -->
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://app-githubdevfinder.netlify.app/"
    />
    <meta
      property="og:description"
      content="A GitHub User Search App"
    />
    <meta
      property="og:image"
      content="https://app-githubdevfinder.netlify.app/assets/design/preview.jpg"
    />
    <meta
      property="og:image:secure_url"
      content="https://app-githubdevfinder.netlify.app/assets/design/preview.jpg"
    />
    <meta property="og:image:type" content="image/jpeg" />
    <meta
      property="og:image:alt"
      content="A design preview of devfinder"
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="628" />

    <!-- X Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@stephenikuomola" />
    <meta name="twitter:creator" content="@stephenikuomola" />
    <meta name="twitter:title" content="Devfinder" />
    <meta
      name="twitter:description"
      content="A GitHub User Search App"
    />
    <meta name="twitter:image" content="https://app-githubdevfinder.netlify.app/assets/design/preview.jpg">

    <!-- JavaScript Link for initial theme to prevent flash of unstyled content  -->
    <script src="src/denfinder_init-theme.js"></script>

    <!-- CSS Links -->
    <link rel="stylesheet" href="src/devfinder.css" />

    <!-- JavaScript Links -->
    <script src="src/devfinder.js" type="module"></script>

    <title>Devfinder</title>
  </head>
  <body>
    <header class="header">
      <nav class="nagivation">
        <div class="navigation__header">
          <a
            href="https://app-githubdevfinder.netlify.app/"
            class="navigation__header-logo"
            >devfinder</a
          >
          <button class="toggle-theme" aria-label="Toggle Theme" type="button">
            <span class="color-theme" data-set-theme="light">LIGHT</span>
            <span class="color-theme" data-set-theme="dark">DARK</span>
            <img
              src="./assets/images/icon-sun.svg"
              alt="light"
              class="icon-sun"
              width="20"
              height="20"
            />
            <img
              src="./assets/images/icon-moon.svg"
              alt="dark"
              class="icon-moon"
              width="20"
              height="20"
            />
          </button>
        </div>
        <search title="Search for GitHub Users" class="navigation__search">
          <form id="searchForm" class="navigation__search-form" novalidate>
            <img
              src="./assets/images/icon-search-dark.svg"
              alt=""
              class="search-icon__dark"
              aria-hidden="true"
              width="25"
              height="24"
            />
            <img
              src="./assets/images/icon-search-light.svg"
              alt=""
              class="search-icon__light"
              aria-hidden="true"
              width="25"
              height="24"
            />
            <label for="username" class="sr-only">Search GitHub username</label>
            <input
              type="search"
              id="username"
              name="username"
              placeholder="Search GitHub username..."
              autocomplete="off"
              spellcheck="false"
              required
            />
            <button type="submit" class="navigation__search-button">
              Search
            </button>
          </form>
          <!-- The Results messages and not for input validation -->
          <p
            id="search-error"
            role="alert"
            aria-live="assertive"
            aria-hidden="true"
          ></p>
        </search>
      </nav>
    </header>
    <main class="app">
      <!--The HTML structure of app when the page loads -->
      <div class="app-search-user-profile">
        <section
          class="app-user-profile-search"
          aria-labelledby="search-github-profile"
        >
          <h1 class="sr-only" id="search-github-profile">
            Search for GitHub Profile
          </h1>
          <img
            src="./assets/images/dark-search.png"
            fetchpriority="high"
            aria-hidden="true"
            width="350"
            height="350"
            alt=""
            data-image-search-user-theme="dark"
          />
          <img
            src="./assets/images/light-search.png"
            fetchpriority="high"
            alt=""
            aria-hidden="true"
            width="350"
            height="350"
            data-image-search-user-theme="light"
          />
          <p class="app-user-profile-search__summary">
            Search for a GitHub user
          </p>
          <p class="app-user-profile-search__text">
            Enter a GitHub username in the search field above and press Enter or
            click Search to view their profile.
          </p>
        </section>
      </div>
    </main>
  </body>
</html>
