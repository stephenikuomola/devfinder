<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search for Developers on GitHub" />
    <meta name="color-scheme" content="light dark" />

    <!-- Favicons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicons/favicon-16x16.png"
    />
    <link rel="manifest" href="/assets/favicons/site.webmanifest" />

    <!-- Font Imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graphs  -->

    <!-- Open Graph Images  -->

    <!-- X Card -->

    <!-- JavaScript Link for initial theme to prevent flash of unstyled content  -->
    <script src="src/denfinder_init-theme.js"></script>

    <!-- CSS Links -->
    <link rel="stylesheet" href="src/devfinder.css" />

    <!-- JavaScript Links -->
    <script src="src/devfinder.js" type="module"></script>

    <title>Devfinder</title>
  </head>
  <body>
    <header class="header">
      <nav class="nagivation">
        <div class="navigation__header">
          <a href="#" class="navigation__header-logo">devfinder</a>
          <button class="toggle-theme" aria-label="Toggle Theme" type="button">
            <span class="color-theme" data-set-theme="light">LIGHT</span>
            <span class="color-theme" data-set-theme="dark">DARK</span>
            <img
              src="./assets/images/icon-sun.svg"
              alt="light"
              class="icon-sun"
              width="20"
              height="20"
            />
            <img
              src="./assets/images/icon-moon.svg"
              alt="dark"
              class="icon-moon"
              width="20"
              height="20"
            />
          </button>
        </div>
        <search title="Search for GitHub Users" class="navigation__search">
          <form id="searchForm" class="navigation__search-form" novalidate>
            <img
              src="./assets/images/icon-search-dark.svg"
              alt=""
              class="search-icon__dark"
              aria-hidden="true"
              width="25"
              height="24"
            />
            <img
              src="./assets/images/icon-search-light.svg"
              alt=""
              class="search-icon__light"
              aria-hidden="true"
              width="25"
              height="24"
            />
            <label for="username" class="sr-only"
              >Search for GitHub Users</label
            >
            <input
              type="search"
              id="username"
              name="username"
              placeholder="Search GitHub username..."
              autocomplete="off"
              spellcheck="false"
            />
            <button type="submit" class="navigation__search-button">
              Search
            </button>
          </form>
          <!-- The Results messages and not for input validation -->
          <span
            id="search-error"
            role="alert"
            aria-live="assertive"
            aria-hidden="false"
            data-error="No result"
          ></span>
        </search>
      </nav>
    </header>
    <main class="app">
      <!-- Do not forget to implement skeleton ui loading animation -->
      <div class="app-search-user-profile"></div>
      <div class="app-no-profile-found">
        <section class="app-no-result-found" aria-labelledby="no-github-user-found">
          <h1 id="no-github-user-found" class="sr-only">We've found no github user</h1>
          <p class="app-no-profile-found__summary">No results found!</p>
          <p class="app-no-profile-found__text">
            We couldn’t find any GitHub users matching your search. Please double-check the username and try again.
          </p>
        </section>
      </div>
    </main>
  </body>
</html>
