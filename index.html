<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search for Developers on GitHub" />
    <meta name="color-scheme" content="light dark" />

    <!-- Favicons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicons/favicon-16x16.png"
    />
    <link rel="manifest" href="/assets/favicons/site.webmanifest" />

    <!-- Font Imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graphs  -->

    <!-- Open Graph Images  -->

    <!-- X Card -->

    <!-- JavaScript Link for initial theme to prevent flash of unstyled content  -->
    <script src="src/denfinder_init-theme.js"></script>

    <!-- CSS Links -->
    <link rel="stylesheet" href="src/devfinder.css" />

    <!-- JavaScript Links -->
    <script src="src/devfinder.js" type="module"></script>

    <title>Devfinder</title>
  </head>
  <body>
    <header class="header">
      <nav class="nagivation">
        <div class="navigation__header">
          <a href="#" class="navigation__header-logo">devfinder</a>
          <button class="toggle-theme" aria-label="Toggle Theme" type="button">
            <span class="color-theme" data-set-theme="light">LIGHT</span>
            <span class="color-theme" data-set-theme="dark">DARK</span>
            <img
              src="./assets/images/icon-sun.svg"
              alt="light"
              class="icon-sun"
              width="20"
              height="20"
            />
            <img
              src="./assets/images/icon-moon.svg"
              alt="dark"
              class="icon-moon"
              width="20"
              height="20"
            />
          </button>
        </div>
        <search title="Search for GitHub Users" class="navigation__search">
          <form id="searchForm" class="navigation__search-form" novalidate>
            <img
              src="./assets/images/icon-search-dark.svg"
              alt=""
              class="search-icon__dark"
              aria-hidden="true"
              width="25"
              height="24"
            />
            <img
              src="./assets/images/icon-search-light.svg"
              alt=""
              class="search-icon__light"
              aria-hidden="true"
              width="25"
              height="24"
            />
            <label for="username" class="sr-only"
              >Search for GitHub Users</label
            >
            <input
              type="search"
              id="username"
              name="username"
              placeholder="Search GitHub username..."
              autocomplete="off"
              spellcheck="false"
            />
            <button type="submit" class="navigation__search-button">
              Search
            </button>
          </form>
          <!-- The Results messages and not for input validation -->
          <span
            id="search-error"
            role="alert"
            aria-live="assertive"
            aria-hidden="false"
            data-error="No result"
          ></span>
        </search>
      </nav>
    </header>
    <main class="app-profile">
      <div class="app-profile__img">
        <img
          src="/assets/design/preview.jpg"
          alt="Octocat's avatar"
          class="app-profile__img-placeholder"
        />
      </div>
      <div class="app-profile__information">
        <section
          class="app-profile__information-header"
          aria-labelledby="profile-heading"
        >
          <h1 id="profile-heading" class="sr-only">Profile</h1>
          <!-- name, username, join date -->
          <div class="user-profile">
            <p class="user-profile__name"></p>
            <p class="user-profile__username"></p>
          </div>
          <p class="join-date">Joined 25 Jan 2021</p>
        </section>

        <section
          class="app-profile__information-bio"
          aria-labelledby="bio-heading"
        >
          <h2 id="bio-heading" class="sr-only">Bio</h2>
          <p>This profile has no bio</p>
        </section>

        <section
          class="app-profile__information-stats"
          aria-labelledby="stats-heading"
        >
          <h2 id="stats-heading" class="sr-only">Stats</h2>
          <!-- repos, followers, following -->
          <ul class="user-stats">
            <li class="user-stats__repos">
              <span>Repos</span>
              <span>8</span>
            </li>
            <li class="user-stats__followers">
              <span>Followers</span>
              <span>3938</span>
            </li>
            <li class="user-stats__following">
              <span>Following</span>
              <span>9</span>
            </li>
          </ul>
        </section>
        <section
          class="app-profile__information-links"
          aria-labelledby="links-heading"
        >
          <h2 id="links-heading" class="sr-only">Links</h2>
          <!-- location, website, twitter, company -->
          <ul class="user-links">
            <li class="user-links__location">
              <img
                alt=""
                aria-hidden="true"
                src="./assets/images/icon-location-dark.svg"
                width="14"
                height="20"
              />
              <span>San Francisco</span>
            </li>
            <li class="user-links__social-media">
              <img
                alt=""
                aria-hidden="true"
                src="./assets/images/icon-x-dark.svg"
                width="20"
                height="20"
              />
              <span class="fade_no-social-media">Not Available</span>
            </li>
            <li class="user-links__portfolio">
              <img
                alt=""
                aria-hidden="true"
                src="./assets/images/icon-website-dark.svg"
                width="20"
                height="20"
              />
              <a href="#"> https://github.blog </a>
            </li>
            <li class="user-links__company">
              <img
                alt=""
                aria-hidden="true"
                src="./assets/images/icon-company-dark.svg"
                width="20"
                height="20"
              />
              <span>@github</span>
            </li>
          </ul>
        </section>
      </div>
    </main>
  </body>
</html>
