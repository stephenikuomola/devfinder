<!doctype html>
<html lang="en" dir="ltr" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Search for Developers on GitHub" />
    <meta name="color-scheme" content="light dark" />

    <!-- Favicons -->
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/assets/favicons/apple-touch-icon.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/assets/favicons/favicon-32x32.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/assets/favicons/favicon-16x16.png"
    />
    <link rel="manifest" href="/assets/favicons/site.webmanifest" />

    <!-- Font Imports -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap"
      rel="stylesheet"
    />

    <!-- Open Graphs  -->

    <!-- Open Graph Images  -->

    <!-- X Card -->

    <!-- JavaScript Link for initial theme to prevent flash of unstyled content  -->
    <script src="src/denfinder_init-theme.js"></script>

    <!-- CSS Links -->
    <link rel="stylesheet" href="src/devfinder.css" />

    <!-- JavaScript Links -->
    <script src="src/devfinder.js" type="module"></script>

    <title>Devfinder</title>
  </head>
  <body>
    <header class="header">
      <nav class="nagivation">
        <div class="navigation__header">
          <a href="#" class="navigation__header-logo">devfinder</a>
          <button class="toggle-theme" aria-label="Toggle Theme" type="button">
            <span class="color-theme" data-set-theme="light">LIGHT</span>
            <span class="color-theme" data-set-theme="dark">DARK</span>
            <img
              src="./assets/images/icon-sun.svg"
              alt="light"
              class="icon-sun"
            />
            <img
              src="./assets/images/icon-moon.svg"
              alt="dark"
              class="icon-moon"
            />
          </button>
        </div>
        <search title="Search for GitHub Users" class="navigation__search">
          <form id="searchForm" class="navigation__search-form" novalidate>
            <img
              src="./assets/images/icon-search-dark.svg"
              alt="Search"
              class="search-icon__dark"
              aria-hidden="false"
            />
            <img
              src="./assets/images/icon-search-light.svg"
              alt="Search"
              class="search-icon__light"
              aria-hidden="false"
            />
            <label for="username" class="sr-only"
              >Search for GitHub Users</label
            >
            <input
              type="search"
              id="username"
              name="username"
              placeholder="Search GitHub username..."
              autocomplete="off"
              spellcheck="false"
            />
            <button type="submit" class="navigation__search-button">
              Search
            </button>
          </form>
          <!-- The Results messages and not for input validation -->
          <span
            id="search-status"
            role="status"
            aria-live="polite"
            class="sr-only"
          ></span>
          <span
            id="search-error"
            role="alert"
            aria-live="assertive"
            hidden
          ></span>
        </search>
      </nav>
    </header>
    <main class="app"></main>
  </body>
</html>
